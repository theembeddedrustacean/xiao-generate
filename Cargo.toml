[package]
name = "xiao-generate"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Project generator for Seeed XIAO-form-factor devices: spawns ready-to-build no_std Rust projects with the recommended crate stack and onboard-component driver templates per module variant, with optional uFerris BSP mode."
license = "MIT OR Apache-2.0"
keywords = ["xiao", "embedded", "esp32", "generator", "no_std"]
categories = ["command-line-utilities", "embedded", "development-tools"]
repository = "https://github.com/theembeddedrustacean/xiao-generate"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
toml_edit = "0.22"
anyhow = "1.0"
ratatui = "0.30"
crossterm = "0.29"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
