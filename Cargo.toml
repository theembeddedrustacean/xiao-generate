[package]
name = "xiao-generate"
version = "0.1.2"
edition = "2021"
rust-version = "1.82"
description = "Project generator for Seeed XIAO devices"
license = "MIT OR Apache-2.0"
keywords = ["xiao", "embedded", "generator", "no_std", "template"]
categories = ["command-line-utilities", "embedded", "development-tools"]
repository = "https://github.com/theembeddedrustacean/xiao-generate"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
toml_edit = "0.22"
anyhow = "1.0"
ratatui = "0.30"
crossterm = "0.29"
tempfile = "3"
rascii_art = "0.4"
ansi-to-tui = "8"

[dev-dependencies]
tempfile = "3"
